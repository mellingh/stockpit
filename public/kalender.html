<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stockpit — Wirtschaftskalender</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" title="Zum Dashboard">Stock<span class="tick">pit</span></a>
    <nav class="topnav">
      <a href="./index.html">Dashboard</a>
      <a href="./analyse.html">Analyse</a>
      <a href="./kalender.html">Kalender</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <main class="page">
    <div class="masthead">
      <div class="dateline">Wirtschaftskalender · diese Woche</div>
      <h1 class="pagetitle">Was den Markt <em>bewegt.</em></h1>
    </div>

    <section class="panel">
      <div class="chart-toolbar" style="padding:0 0 14px;flex-wrap:wrap">
        <button class="rng" data-day="gestern">Gestern</button>
        <button class="rng active" data-day="heute">Heute</button>
        <button class="rng" data-day="morgen">Morgen</button>
        <button class="rng" data-day="woche">Diese Woche</button>
        <div class="chart-legend" style="gap:6px;align-items:center">
          <span class="filter-label" style="margin-right:4px">Wichtigkeit</span>
          <button class="rng" data-imp="high" title="Nur hohe Marktwirkung"><span class="stars s3">★★★</span></button>
          <button class="rng active" data-imp="all" title="Alle Termine">Alle</button>
        </div>
      </div>
      <div id="calendar"><div class="loading-line"><span class="spinner"></span>Kalender wird geladen …</div></div>
    </section>
  </main>

  <footer class="foot">
    Zeiten in deiner lokalen Zeitzone ·
    „Aktuell“ grün/rot = besser/schlechter als Prognose · Alle Angaben ohne Gewähr — keine Anlageberatung.
  </footer>

  <script type="module" src="./js/kalender.js"></script>
</body>
</html>
